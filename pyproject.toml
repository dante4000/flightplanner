[project]
name = "award-trip-planner"
version = "0.1.0"
description = "Rank cash/Aeroplan booking strategies for a LAX-Korea-Japan trip"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "fast-flights==3.0.2",
    "python-dotenv>=1.0",
]

[project.scripts]
award-trip-planner = "award_trip_planner.__main__:main"
atp-solve = "award_trip_planner.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/award_trip_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
